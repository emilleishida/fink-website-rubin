# Visual Identity gallery - Icons section
#
# Add one entry per artwork. To add a new piece:
#   1. Drop a reasonably-sized image (a few MB is fine, it is compressed
#      automatically) into assets/
#   2. Add a new block below pointing "image" at that filename.
#
# Fields:
#   image        (required) filename inside assets/
#   title        (required) short title of the piece
#   artist       (required) artist name, as they want to be credited
#   artist_url   (optional) link to the artist's website / socials / portfolio
#   description  (optional) a sentence or two about the piece
#   background   (optional) CSS color shown behind the image, for pieces with
#                a transparent background that shouldn't sit on plain white
#                or black. Any CSS color works, e.g. "#15284f", "black",
#                "rgb(20, 20, 40)". Leave empty to use the site's default.
#   downloads    (optional) list of full-resolution files for this piece, one
#                button is shown per entry, in the order given, e.g.:
#                  downloads:
#                    - format: PNG
#                      url: https://drive.google.com/...
#                    - format: Adobe
#                      url: https://drive.google.com/...
#                Leave empty/omit if there is nothing to link to yet.
#   wide         (optional) set to true for landscape/horizontal images that
#                look too small when constrained to one column's width. A
#                wide image spans 2 columns instead of 1, so it renders at a
#                sensible height instead of a tiny sliver. Leave unset
#                (false) for portrait/square images.
#   subsection   (optional) groups this item under a titled divider on the
#                page. Must exactly match a "name" in
#                data/gallery/icons-subsections.yaml. Leave unset to have
#                the item show up in the ungrouped mosaic at the end.

